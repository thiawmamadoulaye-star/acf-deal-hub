name: Déploiement des Edge Functions Supabase

# Se déclenche automatiquement à chaque envoi de code sur la branche main,
# UNIQUEMENT si des fichiers du dossier supabase/functions ont changé.
# Peut aussi être lancé manuellement depuis l'onglet "Actions" de GitHub.
on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de la Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Liaison au projet Supabase
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      # --- Fonctions nécessitant une authentification (appelées uniquement
      #     depuis l'application, avec le JWT de l'utilisateur connecté) ---
      - name: Déployer generate-memo
        run: supabase functions deploy generate-memo
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Déployer ai-chat
        run: supabase functions deploy ai-chat
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Déployer send-notification-email
        run: supabase functions deploy send-notification-email
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Déployer yousign-create-signature
        run: supabase functions deploy yousign-create-signature
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      # --- Fonctions accessibles sans JWT (signataire externe / webhook tiers) ---
      - name: Déployer sign-document (sans vérification JWT)
        run: supabase functions deploy sign-document --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Déployer yousign-webhook (sans vérification JWT)
        run: supabase functions deploy yousign-webhook --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
